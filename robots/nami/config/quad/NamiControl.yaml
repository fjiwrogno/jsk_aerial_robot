aerial_robot_control_name: aerial_robot_control/nami_controller

controller:
  torque_allocation_matrix_inv_pub_interval: 0.05
  wrench_allocation_matrix_pub_interval: 0.1
  gimbal_calc_in_fc : true
  gimbal_dof: 0         # fixed rotors (no per-rotor gimbal) -> nami
  underactuate: true    # 4 fixed vertical rotors cannot produce lateral force; tilt the body

  xy:
    p_gain: 2.0
    i_gain: 0.05
    d_gain: 3.5
    limit_sum: 4.0
    limit_p: 12.0
    limit_i: 12.0
    limit_d: 12.0

  z:
    p_gain: 10.0
    i_gain: 3.5
    d_gain: 6.0
    limit_err_p: 1.0
    limit_sum: 25.0 # N for clamping thrust force
    limit_p: 25.0
    limit_i: 25.0
    limit_d: 25.0
    force_landing_descending_rate: -0.5

  # roll_pitch:
  #   p_gain: 13.0
  #   i_gain: 1.0
  #   d_gain: 8.0
  #   limit_sum: 20.0
  #   limit_p: 20.0
  #   limit_i: 20.0
  #   limit_d: 20.0
  roll:
    p_gain: 26.0 #26.0
    i_gain: 1.0
    d_gain: 10.0
    limit_sum: 20.0
    limit_p: 20.0
    limit_i: 20.0
    limit_d: 20.0

  pitch:
    p_gain: 30.0 #30.0
    i_gain: 1.0
    d_gain: 12.0 
    limit_sum: 20.0
    limit_p: 20.0
    limit_i: 20.0
    limit_d: 20.0

    start_rp_integration_height: 0.01

  yaw:
    p_gain: 4.0
    i_gain: 1.0
    d_gain: 2.5
    limit_err_p: 0.4
    limit_sum: 2.5
    limit_p: 1.6
    limit_i: 2.0
    limit_d: 1.0

    need_d_control: true

# underwater mode (loaded when underwater_mode is true; see doc/underwater_simulation.md)
underwater:
  # allocation mode (doc/underwater_allocation_analysis.md); keep the legacy
  # allocation on the real machine until the surge mode is validated in water
  surge_allocation: false
  surge_acc_limit: 1.0       # [m/s^2] clamp on the surge acc feedforward

  # depth control (hand-written PID in NamiController, direct depth sensor feedback).
  # Sized for the 0.3 m test pool (floor at z~-0.145, 2026-07-30 measurement):
  # p=40 with the 6 N clamp keeps the loop linear over a ~15 cm band instead of
  # railing at 6 cm (p=100/20 N railed 33 s into the floor on 7/30); with the
  # measured m+ma ~5.5 kg this gives w~0.43 Hz, zeta~0.85.  Retune from the E2
  # identification once real added mass / damping are known.
  depth_p_gain: 40.0
  depth_i_gain: 10.0
  depth_d_gain: 25.0
  depth_i_limit: 0.5         # [m*s] integral STATE clamp; x i_gain = 5 N authority.
                             # The integrator's real job (buoyancy trim) needs ~0.4 N;
                             # the old 2.0 (=20 N) was what pinned it to the floor.
  depth_hover_thrust: -0.4   # [N] buoyancy trim: negative pushes down (nami is slightly positive buoyant)
  depth_thrust_limit: 6.0    # [N] pool-sized clamp: reaction time margin in 0.3 m of water
  depth_d_lpf_rate: 0.4

  # teleop command mapping (NamiNavigator, topic: underwater/cmd_vel)
  teleop_acc_gain: 3.0       # [m/s^2 per unit stick] forward/lateral acc feedforward (~0.15 rad tilt)
  teleop_yaw_rate_gain: 1.0  # [rad/s per unit stick]
  cmd_timeout: 0.5           # [s] clear latched xy acceleration if the command stream stops
  depth_timeout: 0.25        # [s] neutralize depth thrust if I2C/ROS depth updates stop
  joy_deadzone: 0.2          # normalized stick deadzone; mapping follows aquatic Flamingo
  max_dive_rate: 0.05        # [m/s] target ramp; 0.6 was meaningless in a 0.3 m pool
  max_depth: 0.10            # [m] HARD clamp above the pool floor (-0.145 m): a target
                             # below the physical floor is unreachable and winds the
                             # integrator into the ground (7/30 failure mode)

  # depth from pressure: z = -(P - standard_pressure_kpa) / kpa_per_meter
  standard_pressure_kpa: 101.325
  kpa_per_meter: 9.80638

  # underwater attitude/xy gain set (hot-swapped into the system PIDs at startup;
  # any missing entry falls back to the aerial value above)
  controller:
    xy:
      p_gain: 1.5
      i_gain: 0.05
      d_gain: 1.0
    # Raised vs aerial: the buoyancy restoring torque (CoB above CoG,
    # ~4.5 N*m/rad with the baked added-mass volumes) acts as a constant
    # disturbance the attitude loop must overpower to hold a tilt.  Keep the
    # initial values equal while allowing roll and pitch to be tuned separately.
    # HARD LIMIT: gain*1000 must fit int16 on the rosserial link -> gain < 32.7
    roll:
      p_gain: 30.0
      i_gain: 12.0
      d_gain: 12.0
    pitch:
      p_gain: 30.0
      i_gain: 12.0
      d_gain: 12.0
    yaw:
      p_gain: 0.0
      i_gain: 0.0
      d_gain: 0.0
