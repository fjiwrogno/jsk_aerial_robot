aerial_robot_control_name: aerial_robot_control/nami_controller

# motors 4~7 are bi-directional aquatic thrusters (3D ESC). read by the SIMULATION
# attitude controller (runtime substitute for the BIDIRECTIONAL_PWM2 firmware macro):
# excludes them and the masked motor group from the spinal thrust-saturation checks,
# which otherwise treat negative/near-zero thrust as "below min_thrust" and kill yaw.
bidirectional_motor_start: 4
bidirectional_motor_end: 8

controller:
  torque_allocation_matrix_inv_pub_interval: 0.05
  wrench_allocation_matrix_pub_interval: 0.1
  gimbal_calc_in_fc : false
  gimbal_dof: 0         # fixed rotors (no per-rotor gimbal) -> nami
  underactuate: true    # 4 fixed vertical rotors cannot produce lateral force; tilt the body

  xy:
    p_gain: 2.0
    i_gain: 0.05
    d_gain: 1.7
    limit_sum: 4.0
    limit_p: 12.0
    limit_i: 12.0
    limit_d: 12.0

  z:
    p_gain: 5.0
    i_gain: 1.0
    d_gain: 2.5
    limit_err_p: 1.0
    limit_sum: 25.0 # N for clamping thrust force
    limit_p: 25.0
    limit_i: 25.0
    limit_d: 25.0
    force_landing_descending_rate: -0.5

  roll_pitch:
    p_gain: 15.0
    i_gain: 1.0
    d_gain: 5.0
    limit_sum: 20.0
    limit_p: 20.0
    limit_i: 20.0
    limit_d: 20.0

    start_rp_integration_height: 0.01

  yaw:
    p_gain: 5.0
    i_gain: 1.0
    d_gain: 2.0
    limit_err_p: 0.4
    limit_sum: 20.0
    limit_p: 20.0
    limit_i: 20.0
    limit_d: 20.0

    need_d_control: true

# underwater mode (loaded when underwater_mode is true; see doc/underwater_simulation.md)
underwater:
  # allocation mode (doc/underwater_allocation_analysis.md):
  #   false = legacy rows (Fz, roll, pitch, yaw) -> body-x force is free-running
  #           (constant ~0.15 m/s forward drift), x/y motion via attitude tilt
  #   true  = surge rows (Fx, Fz, roll, yaw) -> drift actively cancelled, direct
  #           surge thrust; pitch passive on the buoyancy righting moment,
  #           lateral stick ignored (no sway authority)
  surge_allocation: true
  surge_acc_limit: 1.0       # [m/s^2] clamp on the surge acc feedforward

  # depth control (hand-written PID in NamiController, direct depth sensor feedback)
  depth_p_gain: 20.0
  depth_i_gain: 0.0
  depth_d_gain: 5.0
  depth_i_limit: 2.0
  depth_hover_thrust: -0.4   # [N] buoyancy trim: negative pushes down (nami is slightly positive buoyant)
  depth_thrust_limit: 10.0   # [N] symmetric clamp (bi-directional rotors)
  depth_d_lpf_rate: 0.6

  # teleop command mapping (NamiNavigator, topic: underwater/cmd_vel)
  teleop_acc_gain: 1.5       # [m/s^2 per unit stick] forward/lateral acc feedforward (~0.15 rad tilt)
  teleop_yaw_rate_gain: 0.5  # [rad/s per unit stick]
  cmd_timeout: 0.5           # [s] clear latched xy acceleration if the command stream stops
  max_dive_rate: 0.3         # [m/s] target depth increment rate
  max_depth: 5.0             # [m] target depth clamp (positive value)

  # depth from pressure: z = -(P - standard_pressure_kpa) / kpa_per_meter
  standard_pressure_kpa: 101.325
  kpa_per_meter: 9.80638

  # underwater attitude/xy gain set (hot-swapped into the system PIDs at startup;
  # any missing entry falls back to the aerial value above)
  controller:
    xy:
      p_gain: 1.5
      i_gain: 0.05
      d_gain: 1.0
    roll_pitch:
      # raised vs aerial: the buoyancy restoring torque (CoB above CoG,
      # ~4.5 N*m/rad with the baked added-mass volumes) acts as a constant
      # disturbance the attitude loop must overpower to hold a tilt; the
      # steady-state gap is closed by the integral term.
      # HARD LIMIT: gain*1000 must fit int16 on the rosserial link -> gain < 32.7
      p_gain: 30.0
      i_gain: 12.0
      d_gain: 20.0
    yaw:
      p_gain: 10.0
      i_gain: 1.0
      d_gain: 5.0
