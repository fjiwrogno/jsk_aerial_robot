## LQI gain reference config for nami.
## Run the generic under-actuated LQI controller with the nami robot model
## (simulation is enough) to obtain LQI feedback gains as a reference for
## tuning the PID gains in NamiControl.yaml.
##
## Usage:
##   roslaunch nami bringup.launch real_machine:=false simulation:=true headless:=true lqi:=true
##   rosrun nami record_lqi_gains.py            # dump gains to a standalone yaml
##   (or) rostopic echo -n 1 /nami/debug/four_axes/gain

aerial_robot_control_name: aerial_robot_control/under_actuated_lqi_controller

controller:
  xy:
    p_gain: 2.0
    i_gain: 0.05
    d_gain: 1.7
    limit_sum: 4.0
    limit_p: 12.0
    limit_i: 12.0
    limit_d: 12.0

  z: # p/i/d gains are replaced by the LQI gains online; only limits are used
    limit_err_p: 1.0
    limit_sum: 25.0 # N for clamping thrust force
    limit_p: 25.0
    limit_i: 25.0
    limit_d: 25.0
    force_landing_descending_rate: -0.5

  roll_pitch:
    start_rp_integration_height: 0.01

  yaw: # p/i/d gains are replaced by the LQI gains online; only limits are used
    limit_err_p: 0.4
    limit_sum: 20.0
    limit_p: 20.0
    limit_i: 20.0
    limit_d: 20.0
    need_d_control: true

  # LQI gain generator (weights initially copied from hydrus quad)
  lqi:
    # keep publishing gains on debug/four_axes/gain at gain_generate_rate,
    # so they can be recorded without arming the robot
    realtime_update: true
    gain_generate_rate: 15.0
    gyro_moment_compensation: false
    clamp_gain: true

    roll_pitch_p: 1000
    roll_pitch_i: 10
    roll_pitch_d: 100

    yaw_p: 100
    yaw_i: 0.5
    yaw_d: 50

    z_p: 20.0  # z weights follow dragon quad; hydrus uses the default 1.0
    z_i: 20.0
    z_d: 30.0

    r1: 1.0
    r2: 1.0
    r3: 1.0
    r4: 1.0
