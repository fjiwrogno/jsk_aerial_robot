aerial_robot_control_name: aerial_robot_control/nami_lqi_controller

controller:
  # Horizontal position remains a PID outer loop. Its acceleration command is
  # converted to roll/pitch targets by UnderActuatedLQIController.
  xy:
    p_gain: 2.0
    i_gain: 0.05
    d_gain: 1.7
    limit_sum: 4.0
    limit_p: 12.0
    limit_i: 12.0
    limit_d: 12.0

  # z/roll/pitch/yaw feedback gains are generated by LQI. These sections keep
  # the common error integration and actuator limits used by the base class.
  z:
    limit_err_p: 1.0
    limit_sum: 25.0
    limit_p: 25.0
    limit_i: 25.0
    limit_d: 25.0
    force_landing_descending_rate: -0.5

  roll_pitch:
    start_rp_integration_height: 0.01

  yaw:
    limit_err_p: 0.4
    limit_sum: 20.0
    limit_p: 20.0
    limit_i: 20.0
    limit_d: 20.0
    need_d_control: false

  lqi:
    lqi_mode: 4
    realtime_update: true
    gain_generate_rate: 15.0
    gyro_moment_compensation: true
    clamp_gain: true

    roll_pitch_p: 400.0
    roll_pitch_i: 10.0
    roll_pitch_d: 40.0

    yaw_p: 100.0
    yaw_i: 0.5
    yaw_d: 50.0

    z_p: 10.0
    z_i: 10.0
    z_d: 20.0

    r1: 1.0
    r2: 1.0
    r3: 1.0
    r4: 1.0
