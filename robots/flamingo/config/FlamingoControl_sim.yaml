aerial_robot_control_name: aerial_robot_control/flamingo_controller

controller:
  torque_allocation_matrix_inv_pub_interval: 0.05
  wrench_allocation_matrix_pub_interval: 0.1
  gimbal_calc_in_fc : true
  underactuate: true

  direct_joystick_mode: false
  joy_yaw_rate: 0.01

  throttle_min_thrust: 0.0
  throttle_max_thrust: 28.0
  throttle_mid: 0.89           # hover point on stick (25/28≈0.89)
  throttle_expo: 0.5
  throttle_deadzone_bottom: 0.1
  motor_max_thrust: 28.0

  # Attitude stick parameters
  direct_pitch_max: 0.40       # max pitch angle (rad), ~11.5 deg
  direct_roll_max: 0.20        # max roll angle (rad), ~11.5 deg
  stick_expo: 0.3              # expo for roll/pitch sticks (finer control near center)

  xy:
    p_gain: 1.0
    i_gain: 0.2
    d_gain: 2.0
    limit_sum: 12.0
    limit_p: 12.0
    limit_i: 12.0
    limit_d: 12.0

  z:
    p_gain: 5.0
    i_gain: 1.0
    d_gain: 2.5
    limit_err_p: 1.0
    limit_sum: 25.0 # N for clamping thrust force
    limit_p: 25.0
    limit_i: 25.0
    limit_d: 25.0
    force_landing_descending_rate: -0.5

  roll_pitch:
    p_gain: 6.0
    i_gain: 0.5
    d_gain: 4.0
    limit_sum: 20.0
    limit_p: 20.0
    limit_i: 20.0
    limit_d: 20.0

    start_rp_integration_height: 0.01

  yaw:
    p_gain: 1.0
    i_gain: 1.0
    d_gain: 4.0
    limit_err_p: 0.4
    limit_sum: 20.0
    limit_p: 20.0
    limit_i: 20.0
    limit_d: 20.0

    need_d_control: true
