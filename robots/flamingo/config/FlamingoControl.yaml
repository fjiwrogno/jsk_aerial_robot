aerial_robot_control_name: aerial_robot_control/flamingo_controller
controller:
  torque_allocation_matrix_inv_pub_interval: 0.05
  wrench_allocation_matrix_pub_interval: 0.1
  gimbal_calc_in_fc : true
  underactuate: true
  joy_yaw_rate: 0.05

  depth_p_gain: 1.0
  depth_i_gain: 0.0
  depth_d_gain: 0.0
  depth_hover_thrust: 5.0 #thrust for submerging in the water

  xy:
    p_gain: 3.5
    i_gain: 0.2
    d_gain: 4.0
    limit_sum: 4.0
    limit_p: 12.0
    limit_i: 12.0
    limit_d: 12.0

  z:
    p_gain: 5.0
    i_gain: 1.0
    d_gain: 2.5
    limit_err_p: 1.0
    limit_sum: 25.0 # N for clamping thrust force
    limit_p: 25.0
    limit_i: 25.0
    limit_d: 25.0
    force_landing_descending_rate: -0.5

  roll:
    p_gain: 50.0 #36
    i_gain: 0.0
    d_gain: 8.0
    limit_sum: 100.0
    limit_p: 100.0
    limit_i: 20.0
    limit_d: 20.0

  pitch:
    p_gain: 30.0
    i_gain: 0.0
    d_gain: 6.0
    limit_sum: 100.0
    limit_p: 100.0
    limit_i: 100.0
    limit_d: 100.0

    start_rp_integration_height: 0.01

  yaw:
  # 增大p: 10.0+1.0
    p_gain: 30.0 #7.0
    i_gain: 0.0 # 1.0
    d_gain: 1.0 # 4.0, 6.0
    limit_err_p: 0.4
    limit_sum: 100.0
    limit_p: 100.0
    limit_i: 100.0
    limit_d: 100.0
