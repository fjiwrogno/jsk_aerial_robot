aerial_robot_control_name: aerial_robot_control/flamingo_controller
controller:
  torque_allocation_matrix_inv_pub_interval: 0.05
  wrench_allocation_matrix_pub_interval: 0.1
  gimbal_calc_in_fc : true
  underactuate: true

  xy:
    p_gain: 3.5
    i_gain: 0.2
    d_gain: 4.0
    limit_sum: 4.0
    limit_p: 12.0
    limit_i: 12.0
    limit_d: 12.0

  z:
    p_gain: 12.0 #20:
    i_gain: 5.0
    d_gain: 5.0
    limit_err_p: 1.0
    limit_sum: 50.0 # N for clamping thrust force
    limit_p: 50.0
    limit_i: 50.0
    limit_d: 50.0
    force_landing_descending_rate: -0.5

  roll:
    p_gain: 20.0
    i_gain: 1.0
    d_gain: 8.0
    limit_sum: 40.0
    limit_p: 40.0
    limit_i: 40.0
    limit_d: 40.0
  
  pitch:
    p_gain: 32.0
    i_gain: 1.0
    d_gain: 16.0
    limit_sum: 60.0
    limit_p: 60.0
    limit_i: 60.0
    limit_d: 60.0

    start_rp_integration_height: 0.01

  yaw:
    p_gain: 6.0
    i_gain: 1.0
    d_gain: 4.0
    limit_err_p: 0.4
    limit_sum: 40.0
    limit_p: 40.0
    limit_i: 40.0
    limit_d: 40.0

    need_d_control: true
