aerial_robot_control_name: aerial_robot_control/flamingo_controller
controller:
  torque_allocation_matrix_inv_pub_interval: 0.05
  wrench_allocation_matrix_pub_interval: 0.1
  gimbal_calc_in_fc : true
  underactuate: true

  direct_joystick_mode: false #joystick control without mocap
  joy_yaw_rate: 0.01

  # Throttle maps stick [0,1] → total vertical Z force (N) → target_acc_z = force / mass.
  # At hover: pid/z/total ≈ 13 m/s²; throttle_mid=0.89 maps to itself via Betaflight expo,
  # so: throttle_max_thrust = hover_acc / throttle_mid * total_mass = 13/0.89*3.77 ≈ 55 N
  # (total_mass = base 3.18 kg + 2×gimbal 0.296 kg ≈ 3.77 kg)
  # Motor physical max: ~28 N/rotor × 2 rotors = 56 N → use 56 as ceiling.
  throttle_min_thrust: 0.0     # total Z force at stick rest (N)
  throttle_max_thrust: 56.0    # total Z force at full stick (N) = 2 rotors × 28 N
  throttle_mid: 0.89           # hover point on stick; expo curve passes through midpoint unchanged
  throttle_expo: 0.2           # mild expo: more linear ramp-up below hover, easier takeoff (was 0.5)
  throttle_deadzone_bottom: 0.05  # small deadzone: feel thrust build earlier (was 0.1)
  motor_max_thrust: 28.0       # physical max per rotor (N); clamp = motor_max_thrust × motor_num
  # Attitude stick parameters
  direct_pitch_max: 0.40       # max pitch angle (rad), ~11.5 deg
  direct_roll_max: 0.40        # max roll angle (rad), ~11.5 deg
  stick_expo: 0.3              # expo for roll/pitch sticks (finer control near center)

  depth_p_gain: 20.0
  depth_i_gain: 0.0
  depth_d_gain: 0.0
  depth_hover_thrust: 6.0 #thrust for submerging in the water
  max_depth: 0.6 # max depth for depth control (meters),0.6
  max_dive_rate: 1.0 # max dive rate (m/s)
  
  xy:
    p_gain: 3.5
    i_gain: 0.2
    d_gain: 4.0
    limit_sum: 20.0
    limit_p: 20.0
    limit_i: 20.0
    limit_d: 20.0

  z:
    p_gain: 12.0 #20:
    i_gain: 5.0
    d_gain: 5.0
    limit_err_p: 1.0
    limit_sum: 50.0 # N for clamping thrust force
    limit_p: 50.0
    limit_i: 50.0
    limit_d: 50.0
    force_landing_descending_rate: -0.5

  roll:
    p_gain: 20.0
    i_gain: 1.0
    d_gain: 8.0
    limit_sum: 40.0
    limit_p: 40.0
    limit_i: 40.0
    limit_d: 40.0
  
  pitch:
    p_gain: 32.0
    i_gain: 1.0
    d_gain: 20.0
    limit_sum: 60.0
    limit_p: 60.0
    limit_i: 60.0
    limit_d: 60.0

    start_rp_integration_height: 0.01

  yaw:
    p_gain: 8.0
    i_gain: 1.0
    d_gain: 4.0
    limit_err_p: 0.4
    limit_sum: 40.0
    limit_p: 40.0
    limit_i: 40.0
    limit_d: 40.0

    need_d_control: true
