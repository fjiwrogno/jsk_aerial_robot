aerial_robot_control_name: aerial_robot_control/flamingo_controller
controller:
  torque_allocation_matrix_inv_pub_interval: 0.05
  wrench_allocation_matrix_pub_interval: 0.1
  gimbal_calc_in_fc : true
  underactuate: true

  direct_joystick_mode: false #joystick control without mocap
  joy_yaw_rate: 0.01

  # Stick at rest (center) = 0 thrust, push up to fly.
  # Non-linear expo for fine hover control.
  # Hover = 25N/rotor, motor max ~31N@25.2V / ~26.5N@22.2V
  throttle_min_thrust: 0.0     # thrust per rotor at stick rest (N)
  throttle_max_thrust: 28.0    # thrust per rotor at full stick (N), conservative for low-voltage safety
  throttle_mid: 0.89           # hover point on stick (25/28≈0.89), expo flattens here
  throttle_expo: 0.5           # strong expo: very flat near hover for fine control
  throttle_deadzone_bottom: 0.1  # bottom deadzone fraction (stick below this = 0 thrust)
  motor_max_thrust: 28.0       # hard clamp per rotor (N), must be < motor physical max
  # Attitude stick parameters
  direct_pitch_max: 0.20       # max pitch angle (rad), ~11.5 deg
  direct_roll_max: 0.20        # max roll angle (rad), ~11.5 deg
  stick_expo: 0.3              # expo for roll/pitch sticks (finer control near center)

  xy:
    p_gain: 3.5
    i_gain: 0.2
    d_gain: 4.0
    limit_sum: 4.0
    limit_p: 12.0
    limit_i: 12.0
    limit_d: 12.0

  z:
    p_gain: 12.0 #20:
    i_gain: 5.0
    d_gain: 5.0
    limit_err_p: 1.0
    limit_sum: 50.0 # N for clamping thrust force
    limit_p: 50.0
    limit_i: 50.0
    limit_d: 50.0
    force_landing_descending_rate: -0.5

  roll:
    p_gain: 20.0
    i_gain: 1.0
    d_gain: 8.0
    limit_sum: 40.0
    limit_p: 40.0
    limit_i: 40.0
    limit_d: 40.0
  
  pitch:
    p_gain: 32.0
    i_gain: 1.0
    d_gain: 20.0
    limit_sum: 60.0
    limit_p: 60.0
    limit_i: 60.0
    limit_d: 60.0

    start_rp_integration_height: 0.01

  yaw:
    p_gain: 6.0
    i_gain: 1.0
    d_gain: 4.0
    limit_err_p: 0.4
    limit_sum: 40.0
    limit_p: 40.0
    limit_i: 40.0
    limit_d: 40.0

    need_d_control: true
